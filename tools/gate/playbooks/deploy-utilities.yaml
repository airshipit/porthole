# Deploys the porthole utility charts together with the backing services they
# operate on (Ceph, MariaDB, PostgreSQL), using the deploy-ceph and
# deploy-charts roles from openstack/openstack-helm.
#
# Expected job variables:
#   osh_git_repo, osh_helm_repo - openstack-helm checkout
#   osh_values_overrides        - OSH override files for mariadb/postgresql
#   DISTRO                      - distro suffix of the locally built images
#   DOCKER_REGISTRY             - registry reachable from all nodes
#
# Optional job variables:
#   porthole_build_local_images - build, push and register porthole's own
#                                 images locally (default: true).
- hosts: primary
  vars:
    porthole_dir: "{{ ansible_user_dir }}/{{ zuul.projects['opendev.org/airship/porthole'].src_dir }}"
    porthole_utility_namespace: utility
    # Point the porthole charts at the images built below.
    porthole_chart_vars: &porthole_chart_vars
      osh_git_repo: "{{ porthole_dir }}"
      osh_helm_repo: "{{ porthole_dir }}/charts"
      osh_values_overrides_path: "{{ porthole_dir }}/charts/values_overrides"
      osh_values_overrides:
        - "images-{{ DISTRO }}.yaml"
      osh_namespace: "{{ porthole_utility_namespace }}"
  tasks:
    # Labels the nodes, creates the namespaces and adds the DOCKER_REGISTRY
    # host (control-plane.minikube.internal) to CoreDNS, which the nodes use
    # as their resolver, so the local registry is reachable from every node.
    - name: Prepare Kubernetes
      include_role:
        name: airship-run-script
      vars:
        workload:
          - ./tools/deployment/airskiff/developer/000-prepare-k8s.sh
        gate_scripts_relative_path: "{{ zuul_treasuremap_relative_path }}"
        osh_values_overrides_path: "{{ osh_git_repo }}/values_overrides"

    - name: Create utility namespace
      shell: |
        set -xe
        kubectl create namespace {{ porthole_utility_namespace }} --dry-run=client -o yaml \
          | kubectl label --local -f - name={{ porthole_utility_namespace }} -o yaml \
          | kubectl apply -f -

    - name: Build porthole charts
      make:
        chdir: "{{ porthole_dir }}"
        target: all

    - name: Build OpenStack-Helm charts
      make:
        chdir: "{{ osh_git_repo }}"
        target: "{{ item }}"
        params:
          SKIP_CHANGELOG: 1
      loop:
        - ceph-adapter-rook
        - mariadb
        - postgresql

    - name: Build, push and re-point porthole's own images
      when: porthole_build_local_images | default(true) | bool
      block:
      - name: Start local docker registry
        shell: |
          set -xe
          docker rm registry --force || true
          docker run -d -p 5000:5000 --restart=always --name registry registry:2

      # The registry runs on the primary node only, so the images are pushed
      # and pulled through DOCKER_REGISTRY, which every node resolves to it.
      # deploy-env configures it as an insecure registry on all nodes.
      - name: Build porthole images and push them to the local registry
        make:
          chdir: "{{ porthole_dir }}"
          target: images
          params:
            DOCKER_REGISTRY: "{{ DOCKER_REGISTRY }}"
            PUSH_IMAGE: "true"
            DISTRO: "{{ DISTRO }}"

      - name: Point the porthole image overrides at the local registry
        shell: |
          set -xe
          sed -i "s#localhost:5000/#{{ DOCKER_REGISTRY }}/#g" \
            charts/values_overrides/*/images-{{ DISTRO }}.yaml
          grep -h "{{ DOCKER_REGISTRY }}" charts/values_overrides/*/images-{{ DISTRO }}.yaml
        args:
          chdir: "{{ porthole_dir }}"

    - name: Deploy calicoctl-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: calicoctl-utility

    - name: Deploy Ceph Rook
      include_role:
        name: deploy-ceph

    - name: Deploy Ceph client keys and config for the utility namespace
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        osh_chart: ceph-adapter-rook
        osh_release: ceph-utility-config
        osh_namespace: "{{ porthole_utility_namespace }}"

    - name: Deploy ceph-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: ceph-utility

    - name: Deploy compute-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: compute-utility

    - name: Deploy etcdctl-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: etcdctl-utility

    - name: Create MariaDB values file
      copy:
        dest: /tmp/mariadb-server-config.yaml
        content: |
          pod:
            replicas:
              server: 1
          conf:
            backup:
              enabled: true
          secrets:
            mariadb:
              backup_restore: mariadb-backup-restore
          manifests:
            cron_job_mariadb_backup: true
            secret_backup_restore: true
            pvc_backup: true
          volume:
            enabled: false
            use_local_path_for_single_pod_cluster:
              enabled: true

    - name: Deploy MariaDB
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        osh_chart: mariadb
        osh_namespace: openstack
        osh_values_overrides_mariadb:
          - /tmp/mariadb-server-config.yaml

    - name: Deploy mysqlclient-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: mysqlclient-utility
        osh_set_values:
          conf.mariadb_backup_restore.enabled_namespaces: openstack

    - name: Deploy openstack-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: openstack-utility

    - name: Deploy PostgreSQL
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        osh_chart: postgresql
        osh_namespace: osh-infra
        osh_set_values:
          pod.replicas.server: "1"
          monitoring.prometheus.enabled: "true"
          storage.pvc.enabled: "true"
          storage.pvc.size: 1Gi

    - name: Deploy postgresql-utility
      include_role:
        name: deploy-charts
        tasks_from: _install
      vars:
        <<: *porthole_chart_vars
        osh_chart: postgresql-utility
        osh_set_values:
          conf.postgresql_backup_restore.enabled_namespaces: osh-infra
...
